<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080d19">
  <title>上傳婚禮照片</title>
  <style media="(prefers-reduced-motion: no-preference)">@view-transition { navigation: auto; }</style>
  <link rel="stylesheet" href="assets/gallery.css">
  <link rel="stylesheet" href="assets/photos.css">
  <link rel="expect" href="#gallery-main" blocking="render">
</head>
<body class="upload-page">
  <header class="gallery-topbar">
    <nav class="gallery-nav" aria-label="婚禮相簿操作">
      <span aria-current="page">上傳照片</span>
      <a href="people.html?view=list">人物列表</a>
      <a href="selfie.html">自拍找我</a>
      <a data-all-photos href="#" target="_blank" rel="noopener" aria-disabled="true">看全部照片<span class="external-mark" aria-hidden="true"> ↗</span></a>
    </nav>
  </header>
  <main id="gallery-main">
    <header class="gallery-intro">
      <div class="gallery-heading">
        <p class="eyebrow">EVERY MOMENT TELLS A STORY</p>
        <h1>把你拍到的照片傳給我們<span>。</span></h1>
        <p class="intro-note">自拍、合照、奇怪瞬間，都歡迎上傳！</p>
      </div>
    </header>

    <section class="card upload-card" aria-label="上傳照片">
      <label class="pick" for="photos">
        <input id="photos" type="file" accept="image/*,.heic,.heif" multiple aria-labelledby="pickTitle" aria-describedby="pickHelp">
        <span class="action" id="pickTitle"><span aria-hidden="true">＋</span> 選擇照片</span>
        <span class="pick-help" id="pickHelp">一次最多 20 張，系統會自動分批上傳。</span>
      </label>

      <div id="count" class="count"></div>
      <div id="preview" class="preview"></div>

      <button id="uploadBtn" class="action action-primary" type="button" disabled>上傳給新郎新娘</button>

      <div id="progressWrap" class="progressWrap">
        <div class="progressTrack">
          <div id="progressBar" class="progressBar" role="progressbar" aria-label="照片上傳進度" aria-valuenow="0"></div>
        </div>
        <div id="progressText" class="progressText">0%</div>
        <div id="batchText" class="batchText"></div>
      </div>

      <div id="status" class="status" role="status"></div>

      <p class="privacy">
        不需要登入 Google、Email 或 LINE 帳號。<br>
        照片會先安全存好，再備份到新人的 Google Drive。<br>
        上傳後會自動整理人物相簿，開放賓客查看與下載。
      </p>
    </section>

    <nav class="upload-links" aria-label="更多婚禮資訊">
      <a href="invitation.html">電子喜帖與婚宴資訊</a>
    </nav>
  </main>
  <footer class="gallery-footer"><span>MADE OF MOMENTS, CONNECTED BY LOVE</span><span>婚禮照片 · v4.1.0</span></footer>

  <script src="config.js"></script><script src="assets/api-client.js"></script><script src="assets/gallery-link.js"></script><script src="assets/backup-message.js"></script><script src="assets/photos.js"></script>
</body>
</html>
